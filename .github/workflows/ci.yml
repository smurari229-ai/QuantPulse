name: QuantPulse CI

on:
  push:
    branches: ["main", "deep-audit-phase1-2026-09-19"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Smoke tests
        run: npm test
      - name: Production build
        run: npm run build
